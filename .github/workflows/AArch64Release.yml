name: Release (Linux aarch64 Cross-Compile)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v1.0.0)"
        required: true
      release_notes:
        description: "Release notes"
        required: true
      clean_version:
        description: "Build app without git hash suffix"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Linux aarch64
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
      APP_RELEASE_BUILD: ${{ github.event.inputs.clean_version }}
      ARCHIVE_NAME: "LatticeLab-${{ github.event.inputs.version }}-linux-aarch64.tar.gz"

    steps:
      - uses: actions/checkout@v4

      - name: Install Cross-Compilation Tools & Dependencies
        run: |
          sudo dpkg --add-architecture arm64
          echo 'APT::Architectures:: "amd64";' | sudo tee /etc/apt/apt.conf.d/99-restrict-amd64
          
          sudo tee /etc/apt/sources.list.d/arm64-ports.sources <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          
          sudo apt-get update
          # Устанавливаем компилятор для aarch64 и ARM64-версии зависимостей
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libx11-dev:arm64 libxrandr-dev:arm64 libudev-dev:arm64 libgl1-mesa-dev:arm64 \
            libxcursor-dev:arm64 libxi-dev:arm64 libfreetype6-dev:arm64 libxinerama-dev:arm64 libwayland-dev:arm64
      - name: Configure and Build
        run: |
          # Передаем CMake указание использовать компилятор aarch64
          cmake --preset release \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DAPP_RELEASE_BUILD=${{ env.APP_RELEASE_BUILD }} \
            -DOPTIMIZE_FOR_NATIVE=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            
          cmake --build --preset release --target LatticeLab
      - name: Prepare Release Dist
        shell: bash
        run: |
          mkdir -p release_dist/assets
          cp LatticeLab release_dist/
          if [ -f Lattice/Lattice-cli ]; then
            cp Lattice/Lattice-cli release_dist/
          fi
          find . -maxdepth 1 -type f -name "*.so*" -exec cp {} release_dist/ \; || true
          cp -r assets/* release_dist/assets/
          if [ -d Mods ]; then
            cp -r Mods release_dist/
          fi
          if [ -d Plugins ]; then
            cp -r Plugins release_dist/
          fi
          tar -czf "${{ env.ARCHIVE_NAME }}" -C release_dist .
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux-aarch64-release
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

  create-release:
      name: Create GitHub Release
      runs-on: ubuntu-latest
      needs: build # Ждет окончания сборки
  
      steps:
        - name: Download Built Artifacts
          uses: actions/download-artifact@v4
          with:
            path: release_artifacts
            merge-multiple: true # Сливает файлы в корень папки без создания подпапки по имени артефакта
  
        - name: Show Release Files
          run: find release_artifacts -maxdepth 3 -type f | sort

        - name: Publish Draft Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ github.event.inputs.version }}
            name: Release ${{ github.event.inputs.version }}
            body: ${{ github.event.inputs.release_notes }}
            files: |
              release_artifacts/*.tar.gz
            draft: true
            prerelease: false
